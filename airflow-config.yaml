apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: airflowsumo
data:
  AIRFLOW__CORE__EXECUTOR: KubernetesExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
  AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: airflowsumo
  AIRFLOW__KUBERNETES_EXECUTOR__POD_TEMPLATE_FILE: /opt/airflow/pod_template/pod_template.yaml
  AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS: "False"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server.airflowsumo.svc.cluster.local:8080/execution/
