apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  namespace: airflowsumo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-dag-processor
  template:
    metadata:
      labels:
        app: airflow-dag-processor
    spec:
      containers:
        - name: dag-processor
          image: apache/airflow:latest
          command:
            - airflow
            - dag-processor

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secrets

          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags

      volumes:
        - name: dags
          configMap:
            name: airflow-dags
