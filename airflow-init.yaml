apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: airflowsumo
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: apache/airflow:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until airflow db check; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
              airflow db migrate
              airflow users create \
                --username "$ADMIN_USERNAME" \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@example.com \
                --password "$ADMIN_PASSWORD"
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secrets
