apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflowsumo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      serviceAccountName: airflow
      containers:
        - name: scheduler
          image: apache/airflow:3.3.2
          command:
            - airflow
            - scheduler

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secrets

          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: pod-template
              mountPath: /opt/airflow/pod_template

      volumes:
        - name: dags
          configMap:
            name: airflow-dags
        - name: pod-template
          configMap:
            name: airflow-pod-template
