apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflowsumo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      containers:
        - name: scheduler
          image: apache/airflow:latest
          command:
            - airflow
            - scheduler

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secrets

          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags

      volumes:
        - name: dags
          configMap:
            name: airflow-dags
